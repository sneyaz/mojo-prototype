<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Acme Co native ad: Keep momentum moving</title>
  <desc id="desc">Mint and ivory campaign artwork with stacked workflow cards.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f5f0"/><stop offset="1" stop-color="#c7e5de"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1b5a52" flood-opacity=".16"/></filter></defs>
  <rect width="640" height="400" rx="18" fill="url(#bg)"/>
  <text x="40" y="54" fill="#205b56" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="-1">Acme Co</text>
  <text x="40" y="140" fill="#193b3a" font-family="Georgia,serif" font-size="41">Keep momentum</text>
  <text x="40" y="190" fill="#193b3a" font-family="Georgia,serif" font-size="41">moving.</text>
  <text x="40" y="235" fill="#506967" font-family="Arial,sans-serif" font-size="18">Turn next steps into progress.</text>
