  <rect x="336" y="265" width="237" height="67" rx="12" fill="#fff"/><rect x="354" y="286" width="24" height="24" rx="7" fill="#b6ded1"/><path d="M392 295h149m-149 14h109" stroke="#c1bac9" stroke-width="5" stroke-linecap="round"/></g>
  <rect x="40" y="294" width="145" height="45" rx="9" fill="#205b56"/>
