<!doctype html>
<html lang="en" data-theme="light">
<head>
<script id="mojo-route-compat">if(location.pathname!=='/'&&!/\.[a-z0-9]+$/i.test(location.pathname)){history.replaceState(history.state,'',location.pathname+'.html'+location.search+location.hash)}</script><link rel="stylesheet" href="mojo-password-gate.css"><script src="mojo-password-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mojo Full Cycle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap">
<style>
/* Layout: 7 funnel stages as gauges, grouped Marketing / Handoff / Sales / Customer.
   Below, a 5x7 readiness matrix: does each discipline have what it needs at each stage?
   Everything animates in on load and on replay; a chevron opens a row's detail, Detail mode opens all of them. */
@property --pct{syntax:'<number>'; inherits:true; initial-value:0}
:root{
  --bg:#ffffff; --paper:#fbfaf7; --line:#e8e3dc; --ink:#141217; --muted:#5f5a66; --accent:#5b3fa0; --accent-2:#8b6fd6; --accent-soft:#f1ecfb;
  --card:#ffffff;
  --ok:#0f766e; --ok-soft:#dcefeb; --warn:#b4560a; --warn-soft:#fcecd9; --bad:#a3273f; --bad-soft:#f8e3e6; --gap:#6d6576;
  --tip:#17141c; --tip-ink:#f6f3fa; --tip-sub:#bdb4c9; --shadow:rgba(40,25,60,.10);
  --display:"Lora", Georgia, "Times New Roman", serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121016; --paper:#18151d; --line:#2e2936; --ink:#f3f0f6; --muted:#b1a9bb; --accent:#a58cf5; --accent-2:#cbb9ff; --accent-soft:#2a2240;
  --card:#211e28;
  --ok:#5fc7b6; --ok-soft:#1a332f; --warn:#f0a660; --warn-soft:#3a2817; --bad:#e8869a; --bad-soft:#3a1f26; --gap:#b0a7bb;
  --tip:#f3f0f6; --tip-ink:#17141c; --tip-sub:#5f5a66; --shadow:rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121016; --paper:#18151d; --line:#2e2936; --ink:#f3f0f6; --muted:#b1a9bb; --accent:#a58cf5; --accent-2:#cbb9ff; --accent-soft:#2a2240;
  --card:#211e28;
  --ok:#5fc7b6; --ok-soft:#1a332f; --warn:#f0a660; --warn-soft:#3a2817; --bad:#e8869a; --bad-soft:#3a1f26; --gap:#b0a7bb;
  --tip:#f3f0f6; --tip-ink:#17141c; --tip-sub:#5f5a66; --shadow:rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:10px}
.wrap{max-width:1200px; margin:0 auto; padding-block:26px 40px; display:flex; flex-direction:column; gap:16px}
.eyebrow{font:700 11px var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
header{display:flex; align-items:center; gap:14px}
.toggle{margin-left:auto; display:inline-flex; padding:3px; border-radius:999px; background:var(--accent-soft); gap:2px}
.toggle .seg{padding:6px 14px; border-radius:999px; font:700 12px var(--body); color:var(--accent)}
.toggle .seg.active{background:var(--accent); color:#fff}
.replay{width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); display:grid; place-items:center; transition:color .15s, border-color .15s; flex:none}
.replay:hover{color:var(--ink); border-color:var(--muted)}
.replay svg{width:15px; height:15px}
.replay.spin svg{animation:spin .6s cubic-bezier(.3,.7,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.reset *{transition:none !important; animation:none !important}

.board{position:relative; border:1px solid var(--line); border-radius:22px; background:var(--paper); overflow-x:auto}
.inner{min-width:760px; padding:22px 22px 26px}
.cols{--g:10px; display:grid; grid-template-columns:200px repeat(7,minmax(0,1fr)); gap:var(--g)}

.groups{display:grid; grid-template-columns:200px repeat(7,minmax(0,1fr)); gap:var(--g); margin-bottom:10px}
.grp{grid-column:2 / 5; font:700 11px var(--body); letter-spacing:.15em; text-transform:uppercase; color:var(--muted); border-top:2px solid var(--line); padding-top:8px; opacity:0; transform:translateY(-6px); transition:opacity .5s ease, transform .5s ease}
.grp.handoff{grid-column:5 / 6; color:var(--accent); border-color:var(--accent-2); text-align:center}
.grp.sales{grid-column:6 / 8}
.grp.customer{grid-column:8 / 9; text-align:right}
.loaded .grp{opacity:1; transform:none}
.grp:nth-child(2){transition-delay:.08s} .grp:nth-child(3){transition-delay:.16s} .grp:nth-child(4){transition-delay:.24s}

.gauge-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 8px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px; opacity:0; transform:translateY(10px); transition:opacity .5s ease var(--gd,0ms), transform .5s ease var(--gd,0ms), box-shadow .2s, border-color .2s}
.loaded .gauge-card{opacity:1; transform:none}
.gauge-card:hover{border-color:var(--accent-2); box-shadow:0 8px 20px var(--shadow)}
.gauge-card.handoff-card{background:var(--accent-soft); border:1px dashed var(--accent-2)}
.g-label{font:700 10.5px var(--body); letter-spacing:.1em; color:var(--muted)}
.g-ring{position:relative; width:100%; max-width:88px; margin-top:4px}
.g-arc{display:block; width:100%; height:auto; aspect-ratio:88/52}
.g-arc path{fill:none; stroke-linecap:round}
.g-arc .track{stroke:var(--line); stroke-width:7}
.g-arc .fill{stroke:var(--accent); stroke-width:7; stroke-dasharray:100 100; stroke-dashoffset:calc(100 - var(--pct)); transition:--pct 1.6s cubic-bezier(.22,.7,.15,1) var(--gd,0ms)}
.loaded .g-arc .fill{--pct:var(--to,0)}
.gauge-card.unlinked .g-arc .fill{stroke:var(--gap); opacity:.55}
.gauge-card.undefined .g-arc .track{stroke-dasharray:3 5}
.gauge-card.undefined .g-arc .fill{display:none}
.g-num{position:absolute; left:50%; bottom:4%; transform:translateX(-50%); font:600 15px/1 var(--display); letter-spacing:-.01em; font-variant-numeric:lining-nums tabular-nums; white-space:nowrap}
.gauge-card.undefined .g-num, .gauge-card.undefined .g-cap{color:var(--muted)}
.g-cap{margin-top:12px; font:600 10.5px var(--body); color:var(--muted)}

.matrix{margin-top:18px; display:flex; flex-direction:column; gap:2px}
.mrow{display:grid; grid-template-columns:200px repeat(7,minmax(0,1fr)); align-items:center; gap:var(--g); padding:9px 0; border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mhead{display:flex; align-items:center; gap:8px; min-width:0}
.mhead .chev{flex:none; width:16px; height:16px; color:var(--muted); transition:transform .25s}
.mrow.open .mhead .chev{transform:rotate(90deg)}
.mhead-label{display:flex; flex-direction:column; gap:4px; min-width:0; text-align:left}
.mhead-label b{font:600 12.5px var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.spark{display:flex; gap:2px; height:4px}
.spark i{flex:1; border-radius:3px; background:var(--line)}
.mrow.open .spark{display:none}
.count{display:none; font:600 11px var(--body); color:var(--muted)}
.mrow.open .count{display:block}
.dot-row{grid-column:2 / span 7; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:var(--g)}
.mrow.open .dot-row{display:none}
.dot{justify-self:center; width:13px; height:13px; border-radius:50%; background:var(--line); border:2px solid var(--line); opacity:0; transform:scale(.4); transition:opacity .35s cubic-bezier(.3,.8,.3,1) var(--dd,0ms), transform .4s cubic-bezier(.3,1.4,.4,1) var(--dd,0ms)}
.loaded .dot{opacity:1; transform:scale(1)}
.dot.ok{background:var(--ok); border-color:var(--ok)}
.dot.warn{background:var(--warn); border-color:var(--warn)}
.dot.bad{background:var(--bad); border-color:var(--bad)}
.dot.un{background:transparent}
.mrow-detail{grid-column:2 / -1; max-height:0; overflow:hidden; opacity:0; transition:max-height .4s ease, opacity .3s ease, margin .4s ease}
.mrow.open .mrow-detail{max-height:220px; opacity:1; margin-top:8px}
.item-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:var(--g)}
.item-card{border:1px dashed var(--line); border-radius:10px; padding:8px 7px; min-height:56px; display:flex; flex-direction:column; justify-content:space-between; gap:6px; text-align:left; background:var(--bg); opacity:0; transform:translateY(6px); transition:opacity .3s ease var(--id,0ms), transform .3s ease var(--id,0ms), border-color .15s}
.mrow.open .item-card{opacity:1; transform:none}
.item-card:hover, .item-card:focus-visible{border-color:var(--accent-2); border-style:solid}
.item-card b{font:600 11.5px/1.3 var(--body); color:var(--ink)}
.item-card span{font:600 10px var(--body)}
.item-card.ok span{color:var(--ok)} .item-card.warn span{color:var(--warn)} .item-card.bad span{color:var(--bad)} .item-card.un span{color:var(--muted)}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:9px; height:9px; border-radius:50%; flex:none}
.legend i.un{background:transparent; border:2px solid var(--line); width:5px; height:5px}

.tip{position:absolute; z-index:5; width:250px; background:var(--tip); color:var(--tip-ink); border-radius:14px; padding:11px 13px 12px; box-shadow:0 16px 40px rgba(20,14,30,.28); pointer-events:none; opacity:0; transform:translate(-50%, calc(-100% - 12px)); transition:opacity .15s}
.tip.show{opacity:1}
.tip .t1{font:700 13px var(--body); display:flex; justify-content:space-between; gap:10px}
.tip .t1 small{font:600 10.5px var(--body); color:var(--tip-sub); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
.tip .why{font:12.5px/1.4 var(--body); color:var(--tip-sub); margin-top:3px}
.tip .practice{font:12.5px/1.4 var(--body); color:var(--tip-sub); margin-top:6px}
.tip .now{font:12.5px/1.4 var(--body); color:var(--tip-sub); margin-top:5px}
.tip .next{font:600 12.5px/1.35 var(--body); color:var(--tip-ink); margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.2)}
.tip .practice b, .tip .now b, .tip .next b{color:var(--tip-ink); font-weight:700}
.tip .next b{color:var(--tip-sub)}

@media (max-width:700px){ .inner{padding:18px 16px 20px} header{flex-wrap:wrap} .eyebrow{width:100%} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} .grp,.gauge-card,.dot,.item-card{opacity:1; transform:none} .g-arc .fill{--pct:var(--to,0) !important} }
</style>
<link rel="stylesheet" href="mojo-column-headers.css?v=hover1"><link rel="stylesheet" href="excerpt-ribbon.css?v=20261111allpages1"><link rel="stylesheet" href="mojo-type-scale.css?v=1">
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">The full cycle · Oct 27 – Nov 2</div>
    <div class="toggle" id="viewToggle" role="group" aria-label="View detail">
      <button type="button" class="seg active" data-view="overview" aria-pressed="true">Overview</button>
      <button type="button" class="seg" data-view="detail" aria-pressed="false">Detail</button>
    </div>
    <button class="replay" id="replay" type="button" aria-label="Replay" title="Replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </header>

  <div class="board" id="board">
    <div class="inner">
      <div class="groups">
        <span class="grp">Marketing</span>
        <span class="grp handoff">Handoff</span>
        <span class="grp sales">Sales</span>
        <span class="grp customer">Customer</span>
      </div>
      <div class="cols" id="gauges"></div>
      <div class="matrix" id="matrix"></div>
    </div>
    <div class="tip" id="tip" role="status"></div>
  </div>

  <div class="legend" aria-label="Key">
    <span><i style="background:var(--ok)"></i>In place</span>
    <span><i style="background:var(--warn)"></i>Needs attention</span>
    <span><i style="background:var(--bad)"></i>Missing</span>
    <span><i class="un"></i>Not measured yet</span>
  </div>
</div>

<script>
(function(){
  const COLS = [
    {id:'target', label:'TARGET', to:100, num:6400, cap:'accounts', tip:['Target · 6,400 accounts','Intent list refreshed 16 days ago; standard is 7.']},
    {id:'reach', label:'REACH', to:83, num:5312, cap:'83% of list', tip:['Reach · 5,312','803 of 1,088 misses are fixable: 412 no DSP match, 391 low match rate.']},
    {id:'engage', label:'ENGAGE', to:9, num:604, cap:'9% of list', tip:['Engage · 604','11% of reached accounts. No comparison group, so lift can’t be credited yet.']},
    {id:'mqa', label:'MQA', cap:'Not defined', state:'undefined', tip:['MQA · not defined','No agreed threshold yet, so Marketing and Sales can’t point to the same handoff moment.']},
    {id:'opportunity', label:'OPPORTUNITY', num:214, cap:'Not linked', state:'unlinked', tip:['Opportunity · 214','Reported in the CRM, but not joined to which accounts saw ads.']},
    {id:'won', label:'WON', num:37, cap:'Not linked', state:'unlinked', tip:['Won · 37','17% of opportunities. Not joined to ad exposure yet.']},
    {id:'expand', label:'EXPAND', cap:'No data yet', state:'undefined', tip:['Expand · no data yet','Closes the loop: renewal and expansion signal feeds the next target list once it exists.']}
  ];
  const ROWS = [
    {id:'audience', label:'Audience & data', items:[
      {label:'ICP + intent list', state:'warn', practice:'Refresh the ICP and intent list on a fixed cycle.', now:'The list is 16 days old against a 7-day standard.', next:'Refresh the intent list this week.'},
      {label:'Match rate', state:'warn', practice:'Match reached accounts back to the target list before judging reach.', now:'412 accounts have no DSP match; 391 match at a low rate.', next:'Fix the 412 missing DSP matches first.'},
      {label:'Buying group coverage', state:'un', practice:'Track which buying-group roles actually engaged, not just accounts.', now:'Role-level engagement isn’t broken out yet.', next:'Tag engagement events by buyer role.'},
      {label:'MQA scoring', state:'bad', practice:'Score accounts against an agreed MQA threshold.', now:'No MQA definition exists, so nothing can be scored.', next:'Draft an MQA scoring model with Sales.'},
      {label:'Account-level join', state:'bad', practice:'Join opportunities to the accounts that saw ads.', now:'214 opportunities aren’t joined to ad exposure.', next:'Adopt the account-level join.'},
      {label:'Wins as lookalikes', state:'bad', practice:'Closed-won accounts seed the next target list.', now:'37 wins aren’t fed back.', next:'Feed wins back as lookalikes.'},
      {label:'Customer signals', state:'un', practice:'Feed renewal and expansion signals back into targeting.', now:'No customer-stage signals are captured yet.', next:'Pull renewal risk into the account list.'}
    ]},
    {id:'plays', label:'Plays & channels', items:[
      {label:'Tiered plays', state:'un', practice:'Vary plays by account tier.', now:'Tiering isn’t applied to the target list yet.', next:'Split plays by tier before the next flight.'},
      {label:'Paid media', state:'ok', practice:'Keep paid media running across the funnel.', now:'42 live campaigns are reaching 83% of the list.', next:'Review the 9 underpacing Q4 flights.'},
      {label:'Website experience', state:'ok', practice:'Give engaged accounts a tailored site experience.', now:'ABM landing pages are live for target accounts.', next:'Extend them to the 9% now engaging.'},
      {label:'SDR follow-up', state:'un', practice:'SDRs follow up the moment an account qualifies.', now:'No MQA trigger exists to follow up on.', next:'Wire SDR follow-up to the MQA threshold once set.'},
      {label:'Deal-stage ads', state:'un', practice:'Shift ad creative once an account becomes an opportunity.', now:'Creative doesn’t change by deal stage today.', next:'Add a deal-stage audience split.'},
      {label:'Win stories', state:'un', practice:'Turn wins into proof for similar accounts.', now:'No win stories are published yet.', next:'Draft one from the 37 closed deals.'},
      {label:'Customer marketing', state:'un', practice:'Keep marketing to accounts after they close.', now:'No post-sale marketing motion exists yet.', next:'Scope a lightweight customer marketing play.'}
    ]},
    {id:'message', label:'Message & content', items:[
      {label:'Role-based messaging', state:'un', practice:'Write messaging for each buyer role, not one generic pitch.', now:'Messaging isn’t split by role yet.', next:'Draft RevOps- and marketing-ops-specific messages.'},
      {label:'AI answer presence', state:'warn', practice:'Show up in the AI answers buyers actually read.', now:'Your brand is in only 1 of 4 sample comparison answers.', next:'Fix the 3 answers that leave you out.'},
      {label:'Proof content', state:'un', practice:'Back engaged accounts with proof, not just reach.', now:'No proof content is mapped to the engage stage.', next:'Pair a case study with each engaged segment.'},
      {label:'Handoff messaging', state:'un', practice:'Agree what Sales says the moment a handoff happens.', now:'There’s no handoff message for Sales to use.', next:'Draft a one-line handoff brief per account.'},
      {label:'Rep enablement content', state:'un', practice:'Give reps the content an opportunity actually needs.', now:'No opportunity-stage content library exists.', next:'Build a starter kit for the top objections.'},
      {label:'Case study library', state:'un', practice:'Capture a case study from every notable win.', now:'None of the 37 wins have a case study yet.', next:'Draft one from the largest win.'},
      {label:'Advocacy content', state:'un', practice:'Turn happy customers into referenceable advocates.', now:'No advocacy program exists yet.', next:'Identify 3 candidates from the won list.'}
    ]},
    {id:'alignment', label:'Sales alignment', items:[
      {label:'Shared target list', state:'un', practice:'Marketing and Sales work the same target list.', now:'Sales hasn’t signed off on the current list.', next:'Review the 6,400-account list with Sales.'},
      {label:'Rep territory map', state:'un', practice:'Map reach back to rep territories.', now:'Reach isn’t broken out by territory.', next:'Overlay the reached accounts on territories.'},
      {label:'Buying-group signoff', state:'un', practice:'Sales confirms the buying group Marketing is engaging.', now:'No signoff step exists on the buying group.', next:'Add a buying-group review before scaling spend.'},
      {label:'Handoff rule + SLA', state:'bad', practice:'Agree a handoff rule and a response-time SLA.', now:'No MQA definition means no handoff rule either.', next:'Agree the rule and SLA with Sales this week.'},
      {label:'Stage velocity', state:'un', practice:'Track how fast opportunities move once marketing is involved.', now:'Stage velocity isn’t tracked by source yet.', next:'Add source to the stage-velocity report.'},
      {label:'Win/loss reasons', state:'un', practice:'Capture why marketing-sourced deals win or lose.', now:'Win/loss reasons aren’t tagged by source.', next:'Add a source field to the win/loss survey.'},
      {label:'CS handoff', state:'un', practice:'Hand won accounts to CS with context intact.', now:'No formal CS handoff exists yet.', next:'Draft a handoff template from the account history.'}
    ]},
    {id:'measurement', label:'Measurement & proof', items:[
      {label:'Budget pacing', state:'warn', practice:'Keep spend pacing against the plan, not just the total.', now:'3 Q3 flights ended with $45,920 of budget unspent.', next:'Confirm final spend before reallocating it.'},
      {label:'Cost per account', state:'ok', practice:'Track cost per reached account, not just impressions.', now:'Cost per account is tracked and reviewed weekly.', next:'Compare it against the 9 underpacing flights.'},
      {label:'Holdout group', state:'bad', practice:'Hold a comparison group out to prove lift.', now:'604 engaged accounts have no holdout group to compare against.', next:'Define a holdout before the next flight.'},
      {label:'MQA → opp rate', state:'bad', practice:'Track what share of MQAs become opportunities.', now:'No MQA definition means no rate to track.', next:'Start counting once MQA is defined.'},
      {label:'Pipeline in dollars', state:'bad', practice:'Report pipeline dollars tied to ad-exposed accounts.', now:'214 opportunities aren’t joined to ad exposure, so none of it is attributable.', next:'Adopt the account-level join first.'},
      {label:'Win rate vs. untargeted', state:'bad', practice:'Compare win rate for targeted vs. untargeted accounts.', now:'That comparison isn’t run today.', next:'Pull win rate by target-list membership.'},
      {label:'Net revenue retention', state:'un', practice:'Watch whether marketing-sourced accounts retain and expand better.', now:'NRR isn’t segmented by source yet.', next:'Add source to the NRR cohort report.'}
    ]}
  ];
  const STATE_LABEL = {ok:'In place', warn:'Needs attention', bad:'Missing', un:'Not measured'};
  const arcPath = 'M8,46 A36,36 0 0 1 80,46';

  const gauges = document.getElementById('gauges');
  gauges.innerHTML = COLS.map((c,i) => {
    const cls = ['gauge-card']; if (c.id==='mqa') cls.push('handoff-card'); if (c.state) cls.push(c.state);
    const num = c.num!=null ? c.num.toLocaleString('en-US') : '—';
    return `<div class="${cls.join(' ')}" data-k="${c.id}" style="--gd:${i*90}ms; grid-column:${i+2}" tabindex="0">
      <span class="g-label">${c.label}</span>
      <div class="g-ring">
        <svg class="g-arc" viewBox="0 0 88 52" aria-hidden="true">
          <path class="track" d="${arcPath}" pathLength="100"/>
          ${c.state ? '' : `<path class="fill" d="${arcPath}" pathLength="100" style="--to:${c.to}"/>`}
        </svg>
        <span class="g-num" data-to="${c.num||0}">${c.state ? num : '0'}</span>
      </div>
      <span class="g-cap">${c.cap}</span>
    </div>`;
  }).join('');

  const matrix = document.getElementById('matrix');
  matrix.innerHTML = ROWS.map((r,ri) => {
    const okCount = r.items.filter(it => it.state === 'ok').length;
    return `<div class="mrow" data-row="${r.id}">
    <button type="button" class="mhead" aria-expanded="false">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      <span class="mhead-label"><b>${r.label}</b><span class="spark">${r.items.map(it=>`<i style="background:${it.state==='un'?'var(--line)':`var(--${it.state})`}"></i>`).join('')}</span><span class="count">${okCount} of ${r.items.length} in place</span></span>
    </button>
    <div class="dot-row">${r.items.map((it,ci)=>`<span class="dot ${it.state}" style="--dd:${ri*60+ci*40}ms" tabindex="0" aria-label="${r.label} · ${COLS[ci].label} · ${STATE_LABEL[it.state]}" title="${STATE_LABEL[it.state]}"></span>`).join('')}</div>
    <div class="mrow-detail"><div class="item-grid">${r.items.map((it,ci)=>`<button type="button" class="item-card ${it.state}" style="--id:${ci*60}ms" data-row="${ri}" data-col="${ci}"><b>${it.label}</b><span>${STATE_LABEL[it.state]}</span></button>`).join('')}</div></div>
  </div>`;
  }).join('');

  const board = document.getElementById('board'), tip = document.getElementById('tip');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nums = [...gauges.querySelectorAll('.g-num')].filter(n => !n.closest('.undefined'));
  let run = 0;
  function play(){
    const id = ++run;
    board.classList.add('reset'); board.classList.remove('loaded'); void board.offsetWidth; board.classList.remove('reset');
    requestAnimationFrame(() => requestAnimationFrame(() => board.classList.add('loaded')));
    if (still) return;
    nums.forEach(n => {
      const to = +n.dataset.to, delay = +(n.closest('.gauge-card').style.getPropertyValue('--gd').replace('ms','')) || 0;
      const t0 = performance.now() + delay, dur = 1300;
      const tick = now => {
        if (id !== run) return;
        const t = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - t, 3);
        n.textContent = Math.round(to * e).toLocaleString('en-US');
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  play();
  const rb = document.getElementById('replay');
  rb.addEventListener('click', () => { play(); rb.classList.remove('spin'); void rb.offsetWidth; rb.classList.add('spin'); });

  function placeTip(el, html){
    tip.innerHTML = html;
    const r = el.getBoundingClientRect(), b = board.getBoundingClientRect();
    let x = r.left - b.left + board.scrollLeft + r.width / 2;
    x = Math.min(board.scrollLeft + board.clientWidth - 133, Math.max(board.scrollLeft + 133, x));
    tip.style.left = x + 'px'; tip.style.top = (r.top - b.top) + 'px';
    tip.classList.add('show');
  }
  const hide = () => tip.classList.remove('show');
  gauges.querySelectorAll('.gauge-card').forEach(card => {
    const data = COLS.find(c => c.id === card.dataset.k)?.tip;
    const html = () => `<div class="t1">${data[0]}</div><div class="why">${data[1]}</div>`;
    card.addEventListener('mouseenter', () => data && placeTip(card, html())); card.addEventListener('mouseleave', hide);
    card.addEventListener('focus', () => data && placeTip(card, html())); card.addEventListener('blur', hide);
  });
  matrix.querySelectorAll('.item-card').forEach(card => {
    const row = ROWS[+card.dataset.row], it = row.items[+card.dataset.col], col = COLS[+card.dataset.col];
    const html = () => `<div class="t1">${it.label}<small>${col.label} · ${STATE_LABEL[it.state]}</small></div><div class="practice"><b>Best practice:</b> ${it.practice}</div><div class="now"><b>Now:</b> ${it.now}</div><div class="next"><b>Next:</b> ${it.next}</div>`;
    card.addEventListener('mouseenter', () => placeTip(card, html())); card.addEventListener('mouseleave', hide);
    card.addEventListener('focus', () => placeTip(card, html())); card.addEventListener('blur', hide);
  });

  const toggle = document.getElementById('viewToggle');
  toggle.addEventListener('click', e => {
    const seg = e.target.closest('[data-view]'); if (!seg) return;
    toggle.querySelectorAll('.seg').forEach(s => { s.classList.toggle('active', s===seg); s.setAttribute('aria-pressed', String(s===seg)); });
    const detail = seg.dataset.view === 'detail';
    matrix.querySelectorAll('.mrow').forEach(row => { row.classList.toggle('open', detail); row.querySelector('.mhead').setAttribute('aria-expanded', String(detail)); });
  });
  matrix.addEventListener('click', e => {
    const head = e.target.closest('.mhead'); if (!head) return;
    const row = head.closest('.mrow'); const open = !row.classList.contains('open');
    row.classList.toggle('open', open); head.setAttribute('aria-expanded', String(open));
  });
})();
</script>
