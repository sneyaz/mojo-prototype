  <input id="chatOn" class="aud-hidden-control" type="checkbox" aria-label="Chat">
  <input id="sidebarOn" class="aud-hidden-control" type="checkbox" aria-label="Sidebar">
  <div class="app">
    <nav class="rail" aria-label="Mojo navigation"></nav>
    <div class="work">
      <header class="topbar">
        <span class="wtitle">AEO</span>
        <div class="paneToggles">
          <label for="chatOn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/></svg> Chat</label>
          <span class="aud-top-current"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Canvas</span>
          <label for="sidebarOn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg> Sidebar</label>
        </div>
        <button class="aud-share" id="aud-share" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share</button>
      </header>
      <nav class="modulenav aud-app-nav" aria-label="Audiences navigation">
        <a href="#feed" data-aud-pillar="feed">Feed</a>
        <a href="#build" data-aud-pillar="build">Build</a>
        <a href="#dashboards" data-aud-pillar="dashboards">Report</a>
        <a href="#strategy" data-aud-pillar="strategy">Plan</a>
        <a href="#best-practices" data-aud-pillar="best-practices" class="aud-practices-link">Best Practices</a>
        <button type="button" class="mojo-create-cta aud-create-cta" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Create new audience</button>
      </nav>
      <div class="panes">
        <aside class="chatpane" aria-label="Mojo chat">
          <div class="chathead">Mojo</div>
          <div class="chatbody"><div class="bubble chat-polish-assistant"><small>Mojo</small><p>Ask about audience freshness, overlap, or where an audience is used.</p></div></div>
          <form class="chatfoot" id="aud-chat-form"><label class="aud-chat-composer"><textarea rows="2" aria-label="Ask Mojo" placeholder="Ask Mojo about audiences…"></textarea><button type="submit" class="chat-polish-send" aria-label="Send message">Send</button></label></form>
        </aside>
        <main class="canvaspane ma-standalone" data-mode="workspace"></main>
        <aside class="aud-sidepane" aria-label="Workspace sidebar"><div class="aud-sidepane-head">Sidebar</div><nav aria-label="Workspace sections"><a href="#feed">Feed</a><a href="#build">Build</a><a href="#dashboards">Report</a><a href="#strategy">Plan</a><a href="#best-practices">Best Practices</a></nav></aside>
      </div>
    </div>
  </div>
  <script>document.querySelector('.wtitle').textContent=new URLSearchParams(location.search).get('app')==='aeo'?'AEO':'Audiences';</script>
  <script>for(const id of ['chatOn','sidebarOn'])document.getElementById(id).addEventListener('change',event=>{if(event.target.checked){const other=document.getElementById(id==='chatOn'?'sidebarOn':'chatOn');other.checked=false;other.dispatchEvent(new Event('change',{bubbles:true}));}});</script>
