<style>
:root{
  --ink:#262626; --ink-70:rgba(38,38,38,.72); --ink-55:#6A6A6A; --ink-35:rgba(38,38,38,.35);
  --line:#ECEAE6; --line-strong:#D8D4CE;
  --surface:#FFFFFF; --surface-2:#ECEAE6;
  --accent:#5B3FA0; --accent-text:#442F7A; --accent-vivid:#7731CA; --accent-deep:#442F7A; --tint:#F1EDE7;
  --success:#2F7A52;
  --heat-lo:#EEE9F6; --heat-mid:#5B3FA0; --heat-hi:#442F7A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Lora",Georgia,serif; --sans:Inter,ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box} body{margin:0} a{color:inherit}
.tn{font-variant-numeric:tabular-nums}
.cap{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-35)}
.btn{display:inline-flex;align-items:center;height:34px;padding:0 14px;background:var(--accent);color:#fff;border:0;border-radius:7px;font:600 13px var(--sans);cursor:pointer;text-decoration:none}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.lnk{font:500 13px var(--sans);color:var(--ink-55);text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;padding:0}
table{width:100%;border-collapse:collapse;font:400 13px var(--sans)}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-35);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink-70)}
th.r,td.r{text-align:right}
html,body{height:100%}
.hidden-r{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.app{display:flex;height:100vh;min-height:760px;overflow:hidden;background:var(--surface)}
.rail{width:52px;flex:none;background:var(--ink);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:3px}
.rail i{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:rgba(249,247,245,.5);flex:none}
.rail i.on{background:var(--accent-vivid);color:#fff}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line-strong);background:#fff}
.wtitle{font:500 14px var(--sans);color:var(--ink-55)}
.paneToggles{margin-left:auto;display:flex;gap:2px}
.paneToggles label{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;font:500 12px var(--sans);color:var(--ink-55);cursor:pointer}
#chatOn:checked ~ .app .paneToggles label[for=chatOn],
#sidebarOn:checked ~ .app .paneToggles label[for=sidebarOn]{background:var(--surface-2);color:var(--ink)}
.modulenav{display:flex;gap:4px;height:40px;align-items:center;padding:0 20px;border-bottom:1px solid var(--line-strong);background:#fff;flex:none}
.modulenav a{padding:6px 12px;font:500 13px var(--sans);color:var(--ink-55);text-decoration:none;border-radius:7px}
.modulenav a.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.panes{flex:1;display:flex;min-height:0}
.chatpane{width:300px;flex:none;border-right:1px solid var(--line-strong);background:#fff;display:none;flex-direction:column}
#chatOn:checked ~ .app .chatpane{display:flex}
.chathead{height:46px;flex:none;display:flex;align-items:center;padding:0 16px;font:600 13px var(--sans);border-bottom:1px solid var(--line)}
.chatbody{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.bubble{background:var(--surface-2);border-radius:12px;padding:10px 13px;font:400 13px/1.5 var(--sans);color:var(--ink-70)}
.chatfoot{padding:12px;border-top:1px solid var(--line)}
.composer{border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px}
.composer textarea{width:100%;border:0;outline:0;font:400 13px var(--sans);resize:none;background:transparent}
.canvaspane{flex:1;min-width:0;overflow:auto;padding:26px 32px 80px}
.sidebarpane{width:260px;flex:none;border-left:1px solid var(--line-strong);background:#fff;overflow:auto;padding:18px;display:none}
#sidebarOn:checked ~ .app .sidebarpane{display:block}
.sbox{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.sbox h3{margin:0;font:600 13px var(--sans)}
.sbox .row2{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font:500 12px var(--sans)}
.sbox .row2:first-of-type{border-top:0}

.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.statcard{border:1px solid var(--line-strong);border-radius:10px;padding:16px 18px}
.statcard .l{font:500 12px var(--sans);color:var(--ink-55)}
.statcard .v{font:500 26px var(--serif);margin-top:6px}
.statcard .s{font:400 11px var(--sans);color:var(--ink-35);margin-top:7px}
.panel{border:1px solid var(--line-strong);border-radius:11px;padding:20px 22px;margin-top:18px;background:#fff}
.panel h2{margin:0;font:500 18px/1.3 var(--serif)}
.panel .d{margin:5px 0 0;font:400 13px var(--sans);color:var(--ink-55)}
.cap{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-35)}
.bar{display:grid;grid-template-columns:190px minmax(0,1fr) 100px;gap:12px;align-items:center;font:500 13px var(--sans);padding:7px 0}
.bar .t{height:11px;background:#EEE9F6;border-radius:999px;overflow:hidden}
.bar .f{height:100%;background:var(--accent-vivid);border-radius:999px}
.bar .f.mid{background:var(--accent)}
.bar .f.over{background:#442F7A}
.n{text-align:right;font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);font:500 13px var(--sans)}
.thesis{margin:14px 0 20px;font:500 16px/1.5 var(--serif);color:var(--ink);max-width:820px}
.move{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.move:first-of-type{border-top:0;padding-top:4px}
.movetag{flex:none;width:110px;font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.movetag.repeat{color:#0A6B4F}
.movetag.resolve{color:var(--accent-text)}
.movetag.define{color:#9A4508}
.movehead{font:600 14px var(--sans);color:var(--ink)}
.movesub{font:400 13px/1.5 var(--sans);color:var(--ink-55);margin-top:4px}

.row:first-child{border-top:0}
.row small{display:block;font:400 12px var(--sans);color:var(--ink-55);margin-top:2px}
.cmocard{background:var(--ink);color:#fff;border-radius:11px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.cmocard .big{font:500 24px var(--serif)}
.cmocard .lbl{font:400 10px var(--sans);color:rgba(255,255,255,.55);margin-top:3px}

</style>

<div style="padding:20px;background:var(--surface-2);box-sizing:border-box;font-family:var(--sans);color:var(--ink)">
<input type="checkbox" id="chatOn" class="hidden-r">
<input type="checkbox" id="sidebarOn" class="hidden-r">

<div class="app" style="border:1px solid var(--line-strong);border-radius:12px">
  <nav class="rail" aria-label="Mojo">
    <i title="Collapse"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></i>
    <i title="Tasks"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></i>
    <i title="Home"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9H3z"/></svg></i>
    <i title="Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></i>
    <i title="Notifications" style="position:relative"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg><span style="position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:50%;background:#C94C4C"></span></i>
    <i title="Quick actions"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></i>
    <i title="Workspaces"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 10v10"/></svg></i>
    <i title="Send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></i>
    <i class="on" title="Canvas"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></i>
    <i title="Chat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></i>
    <i title="Calendar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i>
    <i title="Browse"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></svg></i>
    <i title="Theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></i>
    <div style="flex:1"></div>
    <div style="width:26px;height:26px;border-radius:50%;background:var(--accent-vivid);color:#fff;display:flex;align-items:center;justify-content:center;font:600 11px var(--sans)">S</div>
  </nav>

  <div class="work">
    <div class="topbar">
      <span class="wtitle">Campaigns</span>
      <div class="paneToggles">
        <label for="chatOn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>Chat</label>
        <label style="opacity:.4"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Canvas</label>
        <label for="sidebarOn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>Sidebar</label>
      </div>
      <button class="btn outline" style="height:30px;font-size:12px">Share</button>
    </div>

    <nav class="modulenav" aria-label="Main navigation"></nav>

    <div class="panes">
      <aside class="chatpane">
        <div class="chathead">Chat</div>
        <div class="chatbody"><div class="bubble">This view is for the strategic picture, not day-to-day decisions. Ask me "how does this quarter compare" or "what should we tell the board."</div></div>
        <div class="chatfoot"><div class="composer"><textarea rows="2" placeholder="Ask Mojo…"></textarea></div></div>
      </aside>

      <main class="canvaspane mf-practices-page"><div class="mp-root" id="mp-root"></div></main>


    </div>
  </div>
